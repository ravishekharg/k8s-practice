# Argo CD for the local kind cluster.
# Install: helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace -f argocd-values.yaml
# UI:      http://argocd.localhost:8080   user: admin
# Password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
configs:
  params:
    server.insecure: true # TLS is not needed behind the local Traefik ingress
  cm:
    timeout.reconciliation: 60s # check Git for changes every minute
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
