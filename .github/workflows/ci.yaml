# CI/CD for the webapp:
#   every push / PR  -> vet + build the Go app, validate the Kubernetes manifests
#   push to main     -> build the image, push it to ghcr.io, and bump the image tag in
#                       webapp-db/k8s/03-webapp.yaml. Argo CD in the local kind cluster
#                       sees that commit and rolls out the new version (GitOps).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "webapp-db/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "webapp-db/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/webapp

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-db/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: webapp-db/app/go.mod
          cache-dependency-path: webapp-db/app/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary webapp-db/k8s/

  build-and-deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the new image tag
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v5
      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: webapp-db/app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bump image tag in the manifest (Argo CD deploys it)
        run: |
          sed -i -E "s#^(\s*image:) \S+#\1 ${IMAGE}:${{ steps.tag.outputs.tag }}#" webapp-db/k8s/03-webapp.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: webapp ${{ steps.tag.outputs.tag }} [skip ci]"
          git push
