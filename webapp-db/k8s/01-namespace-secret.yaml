apiVersion: v1
kind: Namespace
metadata:
  name: webapp
---
# Test-only credentials. Shared by the database and the web app.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: webapp
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app-test-password
  POSTGRES_DB: appdb
