# Traefik ingress controller for kind: listens on the node's ports 80/443,
# which kind-config.yaml maps to localhost:8080/8443 on the Mac.
# Install: helm upgrade --install traefik traefik/traefik -n traefik --create-namespace -f traefik-values.yaml
deployment:
  replicas: 1
# hostPorts can only be held by one pod per node, so replace the old pod before starting the new one.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    enabled: true
    # Publish an address on Ingress status; without it Argo CD reports Ingresses as Progressing forever.
    ingressEndpoint:
      ip: 127.0.0.1
    publishedService:
      enabled: false
  kubernetesGateway:
    enabled: false
