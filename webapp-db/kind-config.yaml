# kind cluster that exposes the ingress controller on the Mac:
#   http://webapp.localhost:8080  ->  node port 80  ->  Traefik  ->  Ingress rules
# Create: kind create cluster --name dev --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
